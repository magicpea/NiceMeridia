<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParcMéridia — Block Energy Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #13161e;
    --surface2: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.15);
    --blue: #60a5fa;
    --blue-dim: rgba(96,165,250,0.12);
    --green: #34d399;
    --green-dim: rgba(52,211,153,0.12);
    --purple: #a78bfa;
    --red: #f87171;
    --text: #e2e8f0;
    --muted: #64748b;
    --surplus: rgba(52,211,153,0.2);
    --deficit: rgba(248,113,113,0.08);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  .header {
    padding: 2rem 2.5rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2rem;
  }

  .header-left h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
  }

  .header-left p {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 0.3rem;
    letter-spacing: 0.05em;
  }

  .season-toggle {
    display: flex;
    gap: 0.5rem;
  }

  .season-btn {
    padding: 0.45rem 1.1rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .season-btn.active {
    background: var(--amber);
    border-color: var(--amber);
    color: #000;
    font-weight: 500;
  }

  .season-btn:not(.active):hover {
    border-color: rgba(255,255,255,0.2);
    color: var(--text);
  }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 95px);
  }

  /* BLOCK LIST */
  .block-list {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 1rem 0;
  }

  .block-list::-webkit-scrollbar { width: 4px; }
  .block-list::-webkit-scrollbar-track { background: transparent; }
  .block-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .block-item {
    padding: 0.75rem 1.25rem;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .block-item:hover { background: var(--surface); }

  .block-item.active {
    background: var(--surface2);
    border-left-color: var(--amber);
  }

  .block-num {
    font-weight: 700;
    font-size: 0.9rem;
    color: #fff;
    min-width: 28px;
  }

  .block-meta {
    flex: 1;
  }

  .block-meta-res {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .block-suff {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
  }

  .suff-low { color: var(--red); background: rgba(248,113,113,0.1); }
  .suff-mid { color: var(--amber); background: var(--amber-dim); }
  .suff-high { color: var(--green); background: var(--green-dim); }

  /* MAIN PANEL */
  .main-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .block-header {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 2rem;
  }

  .block-title {
    font-size: 1.3rem;
    font-weight: 800;
    color: #fff;
  }

  .stats-row {
    display: flex;
    gap: 1rem;
    flex: 1;
    flex-wrap: wrap;
  }

  .stat-chip {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .stat-val {
    font-size: 0.9rem;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
  }

  .chart-area {
    flex: 1;
    padding: 1.5rem 2rem;
    position: relative;
    min-height: 0;
  }

  .chart-wrap {
    position: relative;
    height: 100%;
  }

  .legend {
    display: flex;
    gap: 1.5rem;
    padding: 0.75rem 2rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .surplus-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .surplus-info {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .surplus-info span {
    background: var(--green-dim);
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
  }

  .no-surplus {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--red);
    background: rgba(248,113,113,0.1);
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
  }
</style>
</head>

</div>

let chart = null;

function setSeason(s) {
  currentSeason = s;
  document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderChart(currentBlock);
}

function suffClass(s) {
  if (s < 8) return 'suff-low';
  if (s < 14) return 'suff-mid';
  return 'suff-high';
}

function formatKwh(v) {
  if (v >= 1000000) return (v/1000000).toFixed(2) + ' GWh';
  if (v >= 1000) return (v/1000).toFixed(0) + ' MWh';
  return v.toFixed(0) + ' kWh';
}

function buildBlockList() {
  const el = document.getElementById('blockList');
  el.innerHTML = BLOCKS.map((b, i) => `
    <div class="block-item ${i===0?'active':''}" onclick="selectBlock(${i})" id="item-${i}">
      <div class="block-num">${b.block}</div>
      <div class="block-meta">
        <div style="font-size:0.8rem;color:#cbd5e1">${b.residents} res · ${b.kwp} kWp</div>
        <div class="block-meta-res">${b.res_share}% res / ${b.off_share}% off / ${b.ret_share}% ret</div>
      </div>
      <div class="block-suff ${suffClass(b.self_suff)}">${b.self_suff}%</div>
    </div>
  `).join('');
}

function selectBlock(i) {
  currentBlock = i;
  document.querySelectorAll('.block-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`item-${i}`).classList.add('active');
  renderChart(i);
}

function renderChart(i) {
  const b = BLOCKS[i];
  const data = currentSeason === 'summer' ? b.summer : b.winter;
  const hours = data.map(d => `${String(d.h).padStart(2,'0')}:00`);

  // Update header
  document.getElementById('blockTitle').textContent = `Block ${b.block}`;

  const annualPV = formatKwh(b.annual_pv);
  const annualDem = formatKwh(b.annual_dem);
  const seasonLabel = currentSeason === 'summer' ? 'Jul' : 'Jan';

  // Surplus hours
  const surplusHours = data.filter(d => d.pv > d.dem).length;
  const surplusKwh = data.filter(d => d.pv > d.dem).reduce((s,d) => s + (d.pv - d.dem), 0);

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-chip">
      <div class="stat-label">Installed PV</div>
      <div class="stat-val" style="color:var(--amber)">${b.kwp} kWp</div>
    </div>
    <div class="stat-chip">
      <div class="stat-label">Annual PV</div>
      <div class="stat-val" style="color:var(--amber)">${annualPV}/yr</div>
    </div>
    <div class="stat-chip">
      <div class="stat-label">Annual demand</div>
      <div class="stat-val" style="color:var(--blue)">${annualDem}/yr</div>
    </div>
    <div class="stat-chip">
      <div class="stat-label">Self-sufficiency</div>
      <div class="stat-val" style="color:${b.self_suff>=14?'var(--green)':b.self_suff>=8?'var(--amber)':'var(--red)'}">${b.self_suff}%</div>
    </div>
    <div class="stat-chip">
      <div class="stat-label">Residents</div>
      <div class="stat-val" style="color:var(--muted)">${b.residents}</div>
    </div>
  `;

  if (surplusHours > 0) {
    document.getElementById('surplusInfo').innerHTML = `
      <div class="surplus-info">
        <span>✦ ${surplusHours}h surplus · ${surplusKwh.toFixed(0)} kWh/day (${seasonLabel})</span>
      </div>`;
  } else {
    document.getElementById('surplusInfo').innerHTML = `
      <div class="no-surplus">No surplus — ${seasonLabel} deficit all day</div>`;
  }

  // Build datasets
  const pvData = data.map(d => d.pv);
  const resData = data.map(d => d.res);
  const offData = data.map(d => d.off);
  const retData = data.map(d => d.ret);
  const demData = data.map(d => d.dem);

  // Surplus/deficit fill between PV and demand
  const surplusData = data.map(d => Math.max(0, d.pv - d.dem));
  const deficitData = data.map(d => Math.max(0, d.dem - d.pv));

  if (chart) chart.destroy();

  const ctx = document.getElementById('mainChart').getContext('2d');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: hours,
      datasets: [
        {
          label: 'PV Generation',
          data: pvData,
          borderColor: '#f59e0b',
          backgroundColor: 'rgba(245,158,11,0.05)',
          borderWidth: 2.5,
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.4,
          fill: false,
          order: 1,
          z: 10,
        },
        {
          label: 'Total Demand',
          data: demData,
          borderColor: 'rgba(255,255,255,0.25)',
          backgroundColor: 'transparent',
          borderWidth: 1.5,
          borderDash: [5,3],
          pointRadius: 0,
          tension: 0.4,
          fill: false,
          order: 2,
        },
        {
          label: 'Residential',
          data: resData,
          borderColor: '#60a5fa',
          backgroundColor: 'rgba(96,165,250,0.08)',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.4,
          fill: 'origin',
          order: 5,
        },
        {
          label: 'Office',
          data: offData,
          borderColor: '#a78bfa',
          backgroundColor: 'rgba(167,139,250,0.08)',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.4,
          fill: false,
          order: 4,
        },
        {
          label: 'Retail',
          data: retData,
          borderColor: '#34d399',
          backgroundColor: 'rgba(52,211,153,0.08)',
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.4,
          fill: false,
          order: 3,
        },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1e28',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          titleColor: '#94a3b8',
          bodyColor: '#e2e8f0',
          titleFont: { family: 'DM Mono', size: 11 },
          bodyFont: { family: 'DM Mono', size: 11 },
          padding: 10,
          callbacks: {
            title: (items) => `${items[0].label}`,
            label: (item) => {
              const val = item.raw.toFixed(1);
              const balance = pvData[item.dataIndex] - demData[item.dataIndex];
              if (item.datasetIndex === 0) {
                return ` PV: ${val} kWh  ${balance > 0 ? '↑ +'+balance.toFixed(0)+' surplus' : '↓ '+Math.abs(balance).toFixed(0)+' deficit'}`;
              }
              return ` ${item.dataset.label}: ${val} kWh`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false },
          ticks: {
            color: '#475569',
            font: { family: 'DM Mono', size: 10 },
            maxTicksLimit: 12,
          },
          border: { color: 'rgba(255,255,255,0.05)' }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false },
          ticks: {
            color: '#475569',
            font: { family: 'DM Mono', size: 10 },
            callback: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v
          },
          border: { color: 'rgba(255,255,255,0.05)' },
          title: {
            display: true,
            text: 'kWh / hour',
            color: '#334155',
            font: { family: 'DM Mono', size: 10 }
          }
        }
      }
    },
    plugins: [{
      id: 'surplusShading',
      beforeDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea) return;
        const xScale = scales.x;
        const yScale = scales.y;
        const d = currentSeason === 'summer' ? BLOCKS[currentBlock].summer : BLOCKS[currentBlock].winter;

        ctx.save();
        ctx.beginPath();
        ctx.rect(chartArea.left, chartArea.top, chartArea.width, chartArea.height);
        ctx.clip();

        for (let i = 0; i < d.length - 1; i++) {
          const x1 = xScale.getPixelForValue(i);
          const x2 = xScale.getPixelForValue(i + 1);
          const surplus = d[i].pv > d[i].dem;

          const yTop1 = yScale.getPixelForValue(Math.max(d[i].pv, d[i].dem));
          const yBot1 = yScale.getPixelForValue(Math.min(d[i].pv, d[i].dem));
          const yTop2 = yScale.getPixelForValue(Math.max(d[i+1].pv, d[i+1].dem));
          const yBot2 = yScale.getPixelForValue(Math.min(d[i+1].pv, d[i+1].dem));

          ctx.beginPath();
          ctx.moveTo(x1, yBot1);
          ctx.lineTo(x2, yBot2);
          ctx.lineTo(x2, yTop2);
          ctx.lineTo(x1, yTop1);
          ctx.closePath();
          ctx.fillStyle = surplus ? 'rgba(52,211,153,0.18)' : 'rgba(248,113,113,0.06)';
          ctx.fill();
        }
        ctx.restore();
      }
    }]
  });
}

buildBlockList();
renderChart(0);
</script>
</body>
</html>
